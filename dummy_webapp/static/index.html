<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dummy Demo Site — AegisAIR</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <div class="logo">Aegis Demo</div>
      <div class="desc">Simulate normal and malicious traffic for the AegisAIR demo</div>
    </header>

    <main class="panel">
      <section class="box">
        <h3>Login</h3>
        <form id="loginForm">
          <input name="user" placeholder="username" value="alice" />
          <input name="pass" placeholder="password" type="password" />
          <div class="row">
            <button type="submit" class="btn">Submit</button>
            <button type="button" id="failBtn" class="btn ghost">Fail Login</button>
          </div>
        </form>
      </section>

      <section class="box">
        <h3>Quick Actions</h3>
        <div class="row" style="gap:8px">
          <button class="btn" id="viewBtn">Page View</button>
          <button class="btn" id="apiBtn">API Request</button>
          <button class="btn ghost" id="adminBtn">Admin Access</button>
        </div>
        <p class="small">Use these to trigger logs that AegisAIR will monitor.</p>
      </section>

      <section class="box logs-area">
        <h3>Feedback</h3>
        <div id="feedback" class="feed">No actions yet</div>
      </section>
    </main>
  </div>

<script>
const base = "http://127.0.0.1:8000"
const fb = document.getElementById('feedback')

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault()
  const form = new FormData(e.target)
  const resp = await fetch(base + '/login', {method:'POST', body: new URLSearchParams({user: form.get('user'), pass: form.get('pass')})})
  const ok = await resp.json()
  fb.textContent = ok.ok ? 'Login successful' : 'Login failed'
})

document.getElementById('failBtn').addEventListener('click', async ()=>{
  await fetch(base + '/login', {method:'POST', body: new URLSearchParams({user:'admin', pass:'wrong'})})
  fb.textContent = 'Failed login sent'
})

document.getElementById('viewBtn').addEventListener('click', async ()=>{
  await fetch(base + '/')
  fb.textContent = 'Page view sent'
})

document.getElementById('apiBtn').addEventListener('click', async ()=>{
  await fetch(base + '/api/data')
  fb.textContent = 'API request sent'
})

document.getElementById('adminBtn').addEventListener('click', async ()=>{
  await fetch(base + '/admin')
  fb.textContent = 'Admin access attempted'
})
</script>
</body>
</html>
